# Cross-kernel conformance (#6): every push must keep both kernels in
# byte-level agreement with the frozen fixtures — and therefore with each
# other. A divergence is a spec bug or a kernel bug; either way it fails CI
# and deserves an issue, never a quiet fix.
#
# Proof outcomes (checks 5-6) run in two modes since the deterministic
# rlimit budget (#17): per-push CI uses the BYTE ORACLE — the Rust kernel
# must reproduce every direct-attempt script byte-for-byte under the pinned
# solver, which determines THOSE SCRIPTS' results (result = f(script bytes,
# solver version, rlimit), SPEC §7.2) without hours of z3. The FULL empirical
# re-derivation (cold prove of the whole corpus, run-stability fixpoint
# included) runs weekly and on demand.
#
# THE PER-PUSH JOB DOES NOT COVER CHECK 6 FOR GOALS THAT PROVE BY INDUCTION.
# Their verdicts rest on subgoal scripts the oracle never compares — candidate-
# script exposure is outside §10's conformance surface by decision (#139), not
# pending — so the weekly full run is what re-derives them. Treat a green push
# as a strong gate, not a complete one.
name: conformance
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  go-kernel:
    name: reference kernel (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SPEC §13 binds each implementability claim to a surface digest that is
          # RECOMPUTED by re-exporting the recorded source commit. A shallow clone
          # cannot reach historical commits, so the check could not run at all —
          # and a check that cannot run must not be the reason CI is green.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: oath/go.mod
      # The playground's shared JS modules are ESM in `.js` files inside a
      # package with no "type" field, so they load only on a Node with unflagged
      # module-type detection (22.7+). The repo already depended on that locally
      # — kernel-worker.mjs imports ./memfs.js — but nothing in CI ran node, so
      # the runner image's default version was never a constraint until now.
      # Pin it rather than inherit it: a gate that breaks on an image bump is
      # worse than no gate, because the failure looks like the defect it hunts.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build
        run: cd oath && go build ./...
      - name: build cloud driver (compile guard; stays dependency-free)
        run: cd oath && go build -tags cloud ./...
      - name: unit tests
        run: cd oath && go test ./... && go test -tags cloud -run 'TestGCSObjectsRoundTrip' ./...
      # BEFORE `make verify`, and that ordering is load-bearing. The playground's
      # corpus is a MIRROR of codebase/, not a pin — the playground-assets target
      # says so — and the snapshot embeds log.jsonl. `make verify` re-puts every
      # example and journals each one `accepted` even when no hash moves, so
      # running this afterwards would compare the committed snapshot against an
      # already-dirtied journal and fail every clean run, for a reason that has
      # nothing to do with what it claims to check. The script also detects that
      # case by name, so a future reordering fails comprehensibly.
      - name: playground corpus mirrors the committed store (#145)
        run: make check-playground-snapshot

      - name: re-verify examples against committed store
        # make verify re-puts every example; on a checkout this must
        # reproduce the committed hashes (names.json diff = identity drift).
        run: |
          make verify
          git diff --exit-code codebase/names.json \
            || { echo "::error::reference kernel produced different hashes than the committed store"; exit 1; }
      # DRAFTED, HELD BACK — see #95. names.json catches IDENTITY drift but not a
      # fixture whose content changed with no hash moving. The obvious gate is
      # `make fixtures && git diff --exit-code fixtures/`, and it FAILS today: `map`
      # and `Map` collide on case-insensitive filesystems, so a tree generated on
      # macOS has 186 canonical fixtures for 187 definitions while Linux emits 187.
      # Landing a knowingly-red gate teaches people to ignore gates, so this waits
      # for the collision fix rather than shipping broken.

      # The mutation machinery can weaken verification, so it must not exist in a
      # release artifact. Checked against the BUILT BINARY, since a mis-specified build
      # tag produces a normal-looking oath that contains it.
      - name: mutation boundary (release binary contains no rule-disable path)
        run: make mutation-boundary

      # Numbers in prose are claims. README/DESIGN carried "99 fully proven (299
      # properties)" long after the real figures were 123 and 348/427 — nothing was
      # wrong with the kernel, the prose drifted and no check read it.
      - name: documented numbers match the machine's ledger (#96)
        run: make check-doc-numbers

      # A prose FORMAT is a claim too, and a costlier one: the spec is the only
      # artifact an independent implementer reads. §8.6.1 described an envelope the
      # kernel had stopped producing, and every byte-level gate kept passing because
      # none of them reads the document.
      - name: normative prose describes the bytes the kernel emits
        run: make check-spec-bytes

      # Conformance cannot express "the specification is insufficient" — a suite is
      # written by someone who already knows the answers. §13 records what blind
      # implementation attempts found, and machine-checks the half that can be:
      # every claimed surface digest must reproduce from its source commit.
      - name: independent-implementability ledger (SPEC §13)
        run: make check-implementability

      # A blind subject inherits CLAUDE.md in its system prompt — the
      # IMPL-ISOLATED-SESSION violation §13 records and the harness cannot yet
      # remove — so a rule NAMED there is a rule handed to a subject that should
      # be deriving it. The export preflight cannot see this: it checks the
      # archive, and the leak is not in the archive. Written after the same file
      # acquired the leak four times in one session, three of them within ten
      # minutes of the rule against it being written down.
      - name: no coaching leak into always-loaded context
        run: make check-coaching-leak

      # #122 closed on a STRUCTURAL criterion rather than on a blind round
      # reporting fewer unresolved items: every transport distinction has exactly
      # one disposition owned by exactly one layer. That is only the better
      # criterion if it is checked — otherwise it is the same judgement call in a
      # firmer voice.
      - name: §14's transformation is a total single-valued mapping
        run: make check-transformation-table

      # Every byte of a normative identity must have a normative source. A
      # constant living only in the reference makes the vectors containing it
      # irreproducible from the spec — indistinguishable, to a blind reader, from
      # a specification that cannot be implemented.
      - name: identity constants are findable in the spec (SPEC §13)
        run: make check-normative-source

      # §7.4's bridge-obligation bytes are what a second kernel is compared
      # against, so the reference kernel must be derived from the SPEC rather
      # than the SPEC from it. Byte comparison only — this step runs no solver
      # and says nothing about whether the obligations discharge.
      - name: bridge-obligation bytes match SPEC §7.4
        run: make check-bridge-bytes

      # Gates the reconciliation LOGIC, not the live registry. The live check
      # needs production store credentials; this proves the ratchet classifies
      # rather than counts, which is the part that could silently rot.
      - name: corpus/registry reconciliation ratchet
        run: make check-reconciliation-ratchet

      - name: stdlib type-closure branch is demonstrated
        run: make check-stdlib-type-closure

      - name: plugin assets match plugin/ sources
        run: make check-plugin-assets

      # The website renders the repository markdown verbatim. These gates fail if
      # a copy drifts from its source — without them the site can quietly show a
      # different specification from the one an implementer reads, which is the
      # single worst failure a docs site can have. check-web-tutorials existed and
      # had never been wired in.
      - name: website docs match the repository markdown
        run: make check-web-docs

      - name: website tutorials match the repository markdown
        run: make check-web-tutorials

      # The playground is the ONE place source bytes reach the kernel without
      # the kernel being able to check them: syscall/js substitutes U+FFFD for
      # unpaired surrogates before any Go code runs, so `lex`'s UTF-8 guard sees
      # already-valid bytes. Measured: four distinct sources produced one hash,
      # all `accepted`. The guard is JS-side because that is the last point the
      # original UTF-16 exists (#133).
      - name: playground refuses lossy source at the JS boundary (#133)
        run: make check-playground-guard

      # The wasm is a THIRD compilation of the kernel — its own build tags, its
      # own syscall/js boundary — and the Go-vs-Rust conformance gate says
      # nothing about it. This boots the artifact the browser downloads and
      # re-elaborates the corpus through it. It is BEHAVIOURAL agreement only:
      # green over a stale-but-agreeing binary, so it must never be read as a
      # freshness check (#145).
      - name: served playground wasm reproduces corpus identities (#145)
        run: make check-playground-wasm

      # The committed store must be reproducible by the kernel that ships with it.
      # Metadata does not participate in artifact identity, but canonical bytes
      # protect reproducibility and reviewability — different properties, both
      # load-bearing for a store that is committed and reviewed as a diff.
      - name: committed store is canonically encoded (#100)
        run: make check-store

      # THE APPLICATION (#120). Something outside the kernel depends on the
      # kernel, over a real socket, with a sender that shares no code with it.
      # Every other gate here inspects Oath; this one USES it.
      - name: the webhook application still works end to end (#120)
        run: make check-app

      - name: website proof ledger matches canonical fixtures (#30)
        # The site claims its numbers are read live from the machine's ledger.
        # Fail if website/lib/outcomes.json has drifted from fixtures/.
        run: make check-web-ledger

  rust-conformance:
    name: independent kernel (Rust) vs fixtures (byte-oracle mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: pin z3 4.16.0 (proof outcomes are solver-version-sensitive, SPEC §10.5)
        run: |
          curl -sSL -o z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
          unzip -q z3.zip
          echo "$PWD/z3-4.16.0-x64-glibc-2.39/bin" >> "$GITHUB_PATH"
      # The Rust kernel's UN-CORPUS'D normative behaviour is enforced only here. Its
      # per-property abort semantics (#72), never-demote carry-forward (#83), self-hint
      # soundness guard (#67) and campaign vector oracle have no fixture family, so
      # until this step existed a regression in any of them was GREEN in CI: the
      # conformance script would still pass, because it does not exercise them.
      - name: cargo test (behaviour no fixture family covers)
        # Debug build deliberately: `cargo test --release` rebuilds target/release,
        # which is the binary conformance.sh runs. Sharing that tree between a test
        # build and a conformance run is how a long sweep gets a swapped binary
        # mid-flight.
        run: cd oathrs && cargo test

      - name: conformance (checks 1-4 + byte oracle for 5-6)
        run: |
          z3 --version
          OATHRS_CONFORMANCE_PROVE=oracle ./oathrs/conformance.sh

  rust-conformance-full:
    name: independent kernel (Rust) — full empirical re-derivation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: pin z3 4.16.0
        run: |
          curl -sSL -o z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
          unzip -q z3.zip
          echo "$PWD/z3-4.16.0-x64-glibc-2.39/bin" >> "$GITHUB_PATH"
      - name: six-check conformance (cold prove at the SPEC budget)
        # The wall cap is safety-only and never affects outcomes (those are
        # fixed by script bytes + solver + rlimit). GitHub runners burn the
        # rlimit slower than dev hardware — first dispatch invalidated at
        # the 600s default ~21 min in — so give each goal ample wall room.
        env:
          OATHRS_Z3_WALL_CAP_MS: "3600000"
        run: |
          z3 --version
          ./oathrs/conformance.sh

  wasm-build:
    name: wasm32 cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: build library + CLI for wasm (prove feature excluded)
        run: cd oathrs && cargo build --target wasm32-wasip1 --release --no-default-features

  cloud-backend:
    name: cloud backend (Postgres) — integration
    # The default kernel is zero-dep; the GCS+Postgres store backend is behind
    # `-tags cloud`. This job stands up a real Postgres and runs the pg
    # integration tests against it — the harness store-drivers.md requires before
    # the backend touches a live journal.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oathtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: oath/go.mod
      - name: cloud build stays compilable
        run: cd oath && go build -tags cloud ./...
      - name: Postgres + GCS integration tests
        env:
          OATH_TEST_PG_DSN: "postgres://postgres:postgres@localhost:5432/oathtest?sslmode=disable"
        run: cd oath && go test -tags cloud -run 'TestPG|TestGCS' ./...
