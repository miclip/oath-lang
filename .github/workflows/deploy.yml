# Deploy the Oath registry to GCP. Keyless auth via Workload Identity Federation
# (no service-account key stored in GitHub). Triggered manually (type DEPLOY to
# confirm) or by pushing a v* tag. The GCP side — project, billing, WIF, state
# bucket, Artifact Registry — is stood up once by terraform/bootstrap/bootstrap.sh;
# see docs/deploy.md.
#
# Keyless means there are no secrets to store — every value below is a plain repo
# VARIABLE (identifiers, not credentials; WIF security is the provider's
# repo-bound attribute condition + IAM, not the secrecy of these strings):
#   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA, TF_STATE_BUCKET
#   GCP_REGION (optional; defaults to us-central1)
name: deploy

on:
  # Deploy is manual-only: a version tag cuts a release (release.yml), it does not
  # ship the registry. Deploying is a deliberate, billed action — run it here.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm a billed deploy"
        required: true
        default: ""
      enable_database:
        description: "Provision Cloud SQL (billed) — cutover step 1. Serve stays on fs."
        type: boolean
        default: false
      activate_cloud_backend:
        description: "Flip serve+worker to Postgres — cutover step 3 (AFTER migrate-store)."
        type: boolean
        default: false

concurrency:
  group: deploy-registry
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      AR_REPO: oath
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: oath/go.mod

      - name: kernel build + tests (don't ship a broken kernel)
        run: cd oath && go build ./... && go test ./...

      - id: auth
        name: authenticate to GCP (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: resolve image ref
        run: echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/oath:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # --- Cutover custody. docs/deploy-delta.md Phase A steps 1-2.
      # The live journal is the state this deploy changes, and the smoke test below
      # only proves the endpoint serves. Snapshot BEFORE apply, verify the snapshot
      # with the NEW checker, and refuse to deploy over a journal that is already
      # inconsistent — otherwise a pre-existing defect gets attributed to this
      # deploy and the baseline comparison afterwards is meaningless.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: snapshot the live journal (pre-deploy)
        id: presnap
        working-directory: terraform
        run: |
          # Read the bucket from STATE rather than reconstructing the name. The
          # name embeds var.name_prefix, and guessing its default would silently
          # snapshot the wrong bucket (or nothing) on any non-default deployment —
          # producing a green custody check over a journal that is not the live one.
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${AR_REPO}/state"
          BUCKET="$(terraform output -raw store_bucket 2>/dev/null || true)"
          if [ -z "$BUCKET" ]; then
            echo "::warning::no store_bucket in terraform state — treating as a FIRST deploy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"
          mkdir -p ../.cutover
          if gcloud storage cp "gs://$BUCKET/log.jsonl" ../.cutover/pre-deploy.jsonl 2>/tmp/cp.err; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "snapshotted $(wc -l < ../.cutover/pre-deploy.jsonl) entries from gs://$BUCKET/log.jsonl"
          elif ! gcloud storage ls "gs://$BUCKET/" >/dev/null 2>&1; then
            # CANNOT READ THE BUCKET. This is NOT a first deploy, and the two must
            # not be conflated: one means there is no history to protect, the
            # other means there may be history we cannot see. Deploying blind over
            # a journal we lack custody of is the situation this whole step exists
            # to prevent, so fail rather than warn.
            echo "::error::cannot list gs://$BUCKET — the deployer service account may lack"
            echo "storage read on the store bucket. Refusing to deploy without custody of the"
            echo "live journal. Grant roles/storage.objectViewer to the deployer SA, or"
            echo "confirm the bucket is genuinely absent."
            cat /tmp/cp.err || true
            exit 1
          else
            # Bucket readable, no journal in it: a genuine FIRST deploy. Not a
            # silent pass — say so, and record that no baseline exists for the
            # post-deploy comparison.
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::gs://$BUCKET is readable but contains no log.jsonl — treating"
            echo "as a FIRST deploy. If this registry has served before, the store has moved."
          fi

      - name: verify the pre-deploy snapshot with the new checker
        if: steps.presnap.outputs.exists == 'true'
        run: python3 scripts/cutover-check.py .cutover/pre-deploy.jsonl

      - name: build + push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"


      - name: terraform apply
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${AR_REPO}/state"
          terraform apply -auto-approve -input=false \
            -var "project_id=${PROJECT}" \
            -var "region=${REGION}" \
            -var "server_image=${IMAGE}" \
            -var "custom_domain=${{ vars.REGISTRY_DOMAIN }}" \
            -var "enable_database=${{ inputs.enable_database }}" \
            -var "activate_cloud_backend=${{ inputs.activate_cloud_backend }}"

      - name: smoke test (endpoint actually serves)
        working-directory: terraform
        run: |
          API="$(terraform output -raw api_url)"
          echo "probing $API/mcp"
          # GET /mcp must be the oath handler: 405 'POST only'. A 404/5xx means a
          # broken image or a store it can't open — fail the deploy, don't call it
          # green just because apply returned.
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API/mcp" || true)"
            echo "attempt $i: HTTP $code"
            [ "$code" = "405" ] && { echo "healthy"; exit 0; }
            sleep 6
          done
          echo "::error::registry did not return the expected 405 from /mcp after deploy"
          exit 1

      # --- Cutover custody. docs/deploy-delta.md Phase A step 5.
      # The smoke test above proves the endpoint SERVES. It says nothing about
      # whether the new binary reinterpreted history it did not write, which is
      # the actual risk of this cutover. Re-snapshot and diff against the
      # pre-deploy baseline: existing entries must be byte-identical and none may
      # have disappeared.
      - name: verify history is unchanged (post-deploy vs baseline)
        if: steps.presnap.outputs.exists == 'true'
        run: |
          gcloud storage cp "gs://$BUCKET/log.jsonl" .cutover/post-deploy.jsonl
          python3 scripts/cutover-check.py .cutover/post-deploy.jsonl .cutover/pre-deploy.jsonl

      # Evidence retention. Both snapshots are kept whether the deploy passed or
      # failed — a failed cutover is exactly when the before/after pair is needed,
      # and reconstructing it afterwards is impossible.
      - name: retain cutover snapshots
        if: always() && steps.presnap.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cutover-snapshots-${{ github.sha }}
          path: .cutover/
          retention-days: 90

      - name: report endpoint
        working-directory: terraform
        run: |
          echo "### Oath registry deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $(terraform output -raw api_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Store bucket: $(terraform output -raw store_bucket)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker Job: $(terraform output -raw worker_job)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Fetch the admin bearer token with: \`terraform -chdir=terraform output -raw admin_token\`" >> "$GITHUB_STEP_SUMMARY"
          # If a custom domain is mapped, print the DNS record(s) to add.
          DNS="$(terraform output -json custom_domain_dns 2>/dev/null || echo '[]')"
          if [ "$DNS" != "[]" ] && [ -n "$DNS" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Custom domain — add these DNS records at oath-lang.org's host:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$DNS" | jq -r '.[] | "\(.type)\t\(.name)\t\(.rrdata)"' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
