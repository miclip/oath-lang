# Cut a release of both kernels on a version tag. The Go reference kernel (oath)
# is pure, CGO-free Go, so it cross-compiles to every platform from one runner;
# the independent Rust kernel (oathrs) is built natively per-OS. A final job
# collects the archives, writes SHA256SUMS, and publishes a GitHub Release.
#
#   git tag v0.7.0 && git push origin v0.7.0
#
# A version tag cuts a release only; deploying the registry is a separate,
# manual action (deploy.yml → workflow_dispatch).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  oath:
    name: oath kernel (Go — all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: oath/go.mod
      - name: test, then cross-compile + archive
        run: |
          cd oath && go test ./... && cd ..
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            ( cd oath && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags "-s -w" -o "../dist/oath$ext" . )
            tar -C dist -czf "dist/oath-${GITHUB_REF_NAME}-$os-$arch.tar.gz" "oath$ext"
            rm -f "dist/oath$ext"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: oath
          path: dist/*.tar.gz

  oathrs:
    name: oathrs kernel (Rust — ${{ matrix.os }})
    # Linux on ubuntu; BOTH macOS arches on the arm64 macos-latest runner —
    # Apple's toolchain cross-compiles arm64↔x86_64 natively, so we don't wait on
    # the scarce Intel (macos-13) runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux, targets: "x86_64-unknown-linux-gnu:linux-amd64" }
          - { runner: macos-latest, os: macos, targets: "aarch64-apple-darwin:darwin-arm64 x86_64-apple-darwin:darwin-amd64" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build + archive each target
        run: |
          mkdir -p dist
          for entry in ${{ matrix.targets }}; do
            target="${entry%%:*}"; label="${entry##*:}"
            rustup target add "$target"
            ( cd oathrs && cargo build --release --target "$target" )
            tar -C "oathrs/target/$target/release" \
                -czf "dist/oathrs-${GITHUB_REF_NAME}-$label.tar.gz" oathrs
          done
      - uses: actions/upload-artifact@v4
        with:
          name: oathrs-${{ matrix.os }}
          path: dist/*.tar.gz

  release:
    name: publish GitHub Release
    needs: [oath, oathrs]
    runs-on: ubuntu-latest
    steps:
      # The notes are read from the REPOSITORY, so the repository has to be here.
      # This job built nothing and needed no checkout until the notes moved into
      # docs/releases.md, and the omission could not surface until a tag was cut
      # after that change — which is why it failed on its first real run.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # THE NOTES COME FROM docs/releases.md, not from --generate-notes.
          # Autogenerated notes are a list of merged PR titles: accurate, and not
          # what a person upgrading needs. The first thing they must know about a
          # content-addressed system is whether artifact identity moved, and no
          # commit log says that.
          #
          # The section for this tag is extracted by its `## vX.Y.Z` heading. If it
          # is absent the release FAILS rather than falling back to autogeneration —
          # a release whose notes nobody wrote should not look like one somebody did.
          NOTES=$(python3 - "$GITHUB_REF_NAME" <<'PYEOF'
          import re, sys
          tag = sys.argv[1]
          doc = open("docs/releases.md").read()
          m = re.search(rf"^## {re.escape(tag)}\b.*?(?=^## |\Z)", doc, re.M | re.S)
          if not m:
              sys.exit(f"no '## {tag}' section in docs/releases.md")
          print(m.group(0).strip())
          PYEOF
          ) || {
            # Distinguish the two failures. The catch-all message sent a reader
            # looking for a missing SECTION when the file itself was absent.
            if [ ! -f docs/releases.md ]; then
              echo "::error::docs/releases.md is not present — this job needs actions/checkout"
            else
              echo "::error::docs/releases.md has no section for ${GITHUB_REF_NAME}"
            fi
            exit 1
          }
          printf '%s\n\n---\n\n_Checksums in `SHA256SUMS`._\n' "$NOTES" > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md
