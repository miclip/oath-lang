# Does a candidate z3 still prove what the pinned one proved, AT THE NORMATIVE
# BUDGET? Dispatch-only, and deliberately not part of any gate.
#
# WHY THIS EXISTS SEPARATELY FROM THE COLD CONFORMANCE JOB. That job re-derives
# the whole corpus under the PINNED solver; this one asks a different question
# about a DIFFERENT solver, so it cannot borrow that job's answer. And it must
# not borrow its shape either: the cold job has never completed here — six
# consecutive dispatches cancelled at the 350-minute cap (#193) — so a job that
# sweeps all 680 properties at 400M would reproduce a known failure rather than
# produce a measurement.
#
# SO THE UNIVERSE IS DERIVED FROM THE CLAIM, NOT FROM THE CORPUS. A cheap local
# sweep at 4M already settles most of it, and only one set genuinely needs the
# normative budget:
#
#   gains (proved at 4M)        SOUND ALREADY, and conservative — the candidate
#                               reached them with 100x less budget than the
#                               pinned solver was given. More budget adds nothing.
#   stable proven (at 4M)       already shows no regression. Nothing to confirm.
#   stable unproven             unproven under both. Additional 400M gains are
#                               possible but decide nothing about an upgrade.
#   REGRESSION CANDIDATES       the only set that needs 400M, because a reduced
#                               budget cannot tell "lost the proof" from "ran
#                               out of budget".
#
# ONE PROPERTY PER JOB, because the per-goal wall cap has to be hours here
# (runners burn rlimit slower than dev hardware — the cold job was invalidating
# goals ~21 min in under the 600s default) and several such goals cannot share
# one 350-minute job. Sharded, each verdict stands alone, and one job timing out
# does not cost the others their answer.
name: solver upgrade probe

on:
  workflow_dispatch:
    inputs:
      z3_version:
        description: "candidate z3 version (e.g. 5.3.1)"
        required: true
        default: "5.3.1"
      z3_sha256:
        description: "sha256 of z3-<ver>-x64-glibc-2.39.zip — §10.5 makes outcomes solver-sensitive, so the BYTES are pinned, not the tag"
        required: true
        default: "acca9625e8cc8edeb9647b653a1bd696544ddeb5d1c2970a4576734a0c175b40"
      properties:
        description: "space-separated name:prop_index. Re-derive, do not trust this default: the regression candidates are the ledger-proven properties a cheap sweep did not prove."
        required: true
        default: "config-has-key:1 insert:4 rot-h3:6 rot-hl:6 sort:2 str-code:3"
      rlimit:
        description: "per-goal budget. 400000000 is the normative proveRlimit; anything less cannot confirm a regression."
        required: true
        default: "400000000"
      wallcap_sec:
        description: "per-attempt wall cap (safety only, never an outcome). Must be generous: a cap hit is an INVALID attempt, so too small a value reports aborts instead of verdicts."
        required: true
        default: "3600"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        # THE INPUT GOES THROUGH env, NEVER INTO THE COMMAND LINE. A `${{ }}`
        # expansion is substituted before the shell parses the script, so
        # interpolating a dispatch input directly would let it inject shell —
        # and the format check below would run far too late to matter. As an env
        # var it is data to the shell no matter what it contains, and the check
        # is then the only thing deciding whether it is used.
        env:
          PROPS: ${{ inputs.properties }}
        run: |
          set -euo pipefail
          # REFUSE AN EMPTY OR MALFORMED LIST rather than emit an empty matrix:
          # zero jobs is a green run that measured nothing, which is the one
          # outcome indistinguishable from success.
          items=$(printf '%s\n' $PROPS)
          [ -n "$items" ] || { echo "no properties given; a probe over nothing is not a probe"; exit 1; }
          for it in $items; do
            echo "$it" | grep -qE '^[A-Za-z0-9_-]+:[0-9]+$' \
              || { echo "malformed entry '$it' (want name:prop_index)"; exit 1; }
          done
          # DEDUPLICATE, AND SAY WHAT WAS COLLAPSED. A repeated entry produces
          # two matrix jobs that upload to one artifact name, and v4 artifacts
          # are immutable — so the second upload fails AFTER a probe that may
          # have run for hours, marking the run failed over a typo in the input.
          # Collapsing silently would hide a mistake in the list, so the count
          # is reported both ways.
          uniq=$(printf '%s\n' $items | awk '!seen[$0]++')
          nin=$(printf '%s\n' $items | wc -l | tr -d ' ')
          nout=$(printf '%s\n' $uniq | wc -l | tr -d ' ')
          [ "$nin" = "$nout" ] || echo "NOTE: collapsed $nin entries to $nout; duplicates were: $(printf '%s\n' $items | sort | uniq -d | tr '\n' ' ')"
          # NOTE a case this CANNOT see: two distinct ALIASES of one object
          # (`rot:6` and `rot-f:6`) are different strings here and canonicalize
          # to the same target later, in a job that has the store this one does
          # not. They get distinct artifact names, so nothing fails — the cost
          # is duplicated work, not a broken run.
          json=$(printf '%s\n' $uniq | jq -R . | jq -cs .)
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "planned $nout job(s): $json"

  probe:
    needs: plan
    name: ${{ matrix.prop }} @ z3 ${{ inputs.z3_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        prop: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: oath/go.mod

      - name: pin the candidate z3 by DIGEST
        env:
          VER: ${{ inputs.z3_version }}
          SHA: ${{ inputs.z3_sha256 }}
        run: |
          set -euo pipefail
          # -f and RETRIES: without -f, curl writes an HTTP error page into the
          # zip and exits 0, so a failed download surfaces as a corrupt-archive
          # error that cannot be told from a transient outage. The DIGEST check
          # is separate and is the real control — `unzip -t` would pass a
          # replaced but well-formed asset, and §10.5 makes the exact solver
          # bytes part of every outcome this job records.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
               -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${VER}/z3-${VER}-x64-glibc-2.39.zip"
          echo "${SHA}  z3.zip" | sha256sum -c - \
            || { echo "z3 archive is not the pinned build"; exit 1; }
          unzip -q z3.zip
          echo "$PWD/z3-${VER}-x64-glibc-2.39/bin" >> "$GITHUB_PATH"

      - name: the solver under test is the one named
        env:
          VER: ${{ inputs.z3_version }}
        run: |
          set -euo pipefail
          z3 --version
          # The LEDGER's solver must DIFFER from it, or this job is comparing a
          # solver against itself and every "no regression" is trivially true.
          led=$(python3 -c "import json;print(json.load(open('fixtures/prove/outcomes.json'))['solver'])")
          echo "ledger was settled under: $led"
          case "$led" in
            *"$VER"*)
              echo "REFUSING: the ledger is already settled under $VER, so there is nothing to probe"
              exit 1 ;;
          esac
          # The CANDIDATE must also be the solver actually on PATH, or this job
          # pins one version by digest and measures another.
          z3 --version | grep -qF "$VER" \
            || { echo "z3 on PATH is not $VER"; exit 1; }

      - name: the named property is ledger-PROVEN (else this job proves nothing)
        id: target
        env:
          PROP: ${{ matrix.prop }}
        run: |
          set -euo pipefail
          # A REGRESSION PROBE ONLY MEANS ANYTHING ON A PROPERTY THE LEDGER
          # PROVES. A stale or mistyped name would otherwise be swept, come back
          # `unknown`, and be read as a regression — measuring nothing while
          # looking exactly like the finding this job exists to produce.
          python3 - "$PROP" <<'PY'
          import json, os, sys
          name, idx = sys.argv[1].rsplit(':', 1); idx = int(idx)
          led = json.load(open('fixtures/prove/outcomes.json'))
          for d in led['definitions']:
              if d['name'] == name:
                  if idx >= len(d['props']):
                      sys.exit(f"{name} has {len(d['props'])} properties; no index {idx}")
                  p = d['props'][idx]
                  if not p['proven']:
                      sys.exit(f"{name}[{idx}] ({p['name']}) is NOT proven in the ledger — "
                               "a regression probe on it would measure nothing")
                  print(f"ok: {name}[{idx}] ({p['name']}) is ledger-proven")
                  hash_ = d['hash']
                  break
          else:
              sys.exit(f"no definition named {name} in the ledger")

          # THE LEDGER IS PER-NAME AND THE SWEEP IS PER-OBJECT, and the two
          # disagree wherever a name is an alias. outcomes.json lists `rot` and
          # `rot-f` as separate entries over ONE object, while the sweep builds
          # targets from the metadata's canonical name and matches
          # OATH_SWEEP_ONLY against that — so an alias passes the check above
          # and is then refused by the sweep, which fatals and leaves this job
          # with no verdict for an input it had just accepted. Canonicalize
          # here, and SAY SO, rather than silently probing a different name.
          meta = json.load(open(f'codebase/meta/{hash_}.json'))
          canon = meta.get('name')
          if not canon:
              sys.exit(f'meta for {hash_[:12]} records no canonical name')
          if canon != name:
              print(f"NOTE: {name!r} is an alias of the object whose canonical name is "
                    f"{canon!r}; probing {canon}[{idx}], which is the same object")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"canon={canon}:{idx}\n")
          PY

      - name: probe at the normative budget
        id: probe
        env:
          PROP: ${{ matrix.prop }}
          TARGET: ${{ steps.target.outputs.canon }}
          OATH_SWEEP_ALL: "1"
          OATH_PROVE_RLIMIT: ${{ inputs.rlimit }}
          OATH_PROVE_WALLCAP_SEC: ${{ inputs.wallcap_sec }}
          OATH_SWEEP_OUT: ${{ github.workspace }}/probe.jsonl
        run: |
          set -uo pipefail
          # SELF-LIMIT BELOW THE JOB CAP. A job-limit kill sets the whole RUN's
          # conclusion to `cancelled`, which is how one never-completing job
          # came to report over 183 that had. Exiting on our own terms keeps
          # "ran out of wall clock" distinguishable from "measured something".
          cd oath
          OATH_SWEEP_ONLY="$TARGET" timeout --signal=TERM --kill-after=60 320m \
            go test -run TestProveReasonsSweep -count=1 -timeout 340m . 2>&1 | tail -40
          rc=${PIPESTATUS[0]}
          echo "selflimit_rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = 124 ] && echo "SELF-LIMITED at 320m — this is an ENVIRONMENTAL ABORT, not a verdict"
          exit 0

      # upload-artifact@v4 REJECTS a colon in a name, and every matrix value has
      # one. Without this the upload fails and a job that measured correctly is
      # marked failed with its record thrown away — the result lost at the last
      # step. GitHub expressions have no replace(), so the slug is computed here.
      - name: artifact slug
        id: slug
        if: always()
        env:
          PROP: ${{ matrix.prop }}
        run: echo "v=$(printf '%s' "$PROP" | tr ':' '-')" >> "$GITHUB_OUTPUT"

      - name: verdict
        env:
          PROP: ${{ matrix.prop }}
          RC: ${{ steps.probe.outputs.selflimit_rc }}
          RLIMIT: ${{ inputs.rlimit }}
        run: |
          set -euo pipefail
          python3 - "$PROP" "$RC" "$RLIMIT" <<'PY'
          import json, os, sys
          prop, rc, rlimit = sys.argv[1], sys.argv[2], sys.argv[3]
          path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'probe.jsonl')
          try:
              rec = json.loads(open(path).read().strip())
          except Exception as e:
              print(f"INDETERMINATE {prop}: no record ({e}); rc={rc}")
              sys.exit(0)

          # A CONFIRMED REGRESSION IS A CLAIM ABOUT THE NORMATIVE BUDGET, so the
          # budget this run used has to BE that one. rlimit is a dispatch input:
          # a lower value manufactures regressions (a proof that merely needed
          # more budget) and a higher one hides them. The normative figure is
          # DERIVED from prove.go rather than written here, because a second
          # copy of it is correct exactly once.
          import re
          src = open('oath/prove.go').read()
          m = re.search(r'proveRlimit\s*=\s*([0-9_]+)', src)
          if not m:
              print(f"INDETERMINATE {prop}: cannot read proveRlimit from oath/prove.go, "
                    "so there is nothing to compare this run's budget against")
              sys.exit(0)
          normative = int(m.group(1).replace('_', ''))
          non_normative = int(rlimit) != normative

          # ANY NONZERO EXIT MEANS THE INSTRUMENT ITSELF FAILED. The probe step
          # masks go test's status on purpose so a self-limit is not a job
          # failure, but the sweep also fails on its OWN controls — a one-sided
          # script pin, telemetry it cannot vouch for. A record written by a run
          # that then failed a control is not evidence, and reading a verdict
          # off it would report the instrument's broken state as the solver's.
          if rc not in ('0', ''):
              reason = "self-limited on wall clock" if rc == '124' else f"the sweep exited {rc} (a control failed)"
              print(f"INDETERMINATE {prop}: {reason} — not measured, and NOT a regression")
              sys.exit(0)

          # THE STATUS VOCABULARY DECIDES THIS, AND ONLY `unknown` IS A VALID
          # NEGATIVE. prove.go defines `invalidated` as "a strategy attempt was
          # environmentally aborted and no remaining strategy proved the goal —
          # NO VALID NEGATIVE VERDICT EXISTS (SPEC §7.2)", so reading it as a
          # regression inverts its meaning. A capHit is likewise a host fact,
          # never an outcome. And `refuted` is not a lost proof at all: it is
          # the candidate solver claiming a COUNTEREXAMPLE to something the
          # pinned one proved, which is a disagreement about truth and the
          # loudest thing this job can find.
          st = rec['status']
          caps = sum(1 for a in rec.get('attempts', ()) if a.get('verdict') == 'capHit')
          pin = rec.get('pinned_script_match')
          print(f"{prop}: status={st} caps={caps} pin_match={pin} rlimit={rlimit} "
                f"wall={rec['wall_seconds']:.0f}s attempts={len(rec.get('attempts', ()))}")

          if pin is False:
              print(f"INDETERMINATE {prop}: the script did not match fixtures/prove/scripts.txt, "
                    "so this record describes a different experiment than the pinned one")
              sys.exit(0)
          if st == 'proven' and int(rlimit) > normative:
              # ASYMMETRIC WITH THE REGRESSION CASE, DELIBERATELY. A proof at or
              # BELOW the normative budget clears the property a fortiori: the
              # candidate needed no more than the ledger allows. A proof ABOVE it
              # shows only that a LARGER allowance suffices and leaves the
              # normative question open — the hidden-regression direction.
              print(f"INDETERMINATE {prop}: proven, but at {rlimit} > the normative {normative}. "
                    "That shows a larger allowance suffices, not that the normative budget does")
          elif st == 'proven':
              print(f"NOT-A-REGRESSION {prop}: proves at {rlimit} (<= the normative {normative})")
          elif st == 'refuted':
              print(f"::error::SOLVER-DISAGREEMENT {prop}: REFUTED at {rlimit}, but the ledger PROVES it. "
                    "This is a disagreement about truth, not a lost proof — do not file it as a regression.")
              sys.exit(1)
          elif st == 'invalidated' or caps:
              print(f"INDETERMINATE {prop}: environmentally aborted (status={st}, capHit={caps}) — "
                    "not measured, and NOT a regression")
          elif st == 'unknown' and non_normative:
              print(f"INDETERMINATE {prop}: unknown, but at {rlimit} rather than the normative "
                    f"{normative}. A smaller budget invents regressions and a larger one hides them, "
                    "so this says nothing either way")
          elif st == 'unknown':
              print(f"::warning::CONFIRMED-REGRESSION {prop}: unknown at the normative {normative} "
                    "on a script matching the pin — the candidate solver does not prove what the ledger does")
          else:
              print(f"INDETERMINATE {prop}: unrecognised status {st!r}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ steps.slug.outputs.v }}
          path: probe.jsonl
          if-no-files-found: warn
